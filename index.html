<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易知阁 · AI命理解读</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e8d5a3;
    font-family: 'STSong', 'SimSun', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .logo {
    font-size: 48px;
    letter-spacing: 8px;
    margin-bottom: 8px;
    color: #c9a84c;
  }
  .subtitle {
    font-size: 14px;
    letter-spacing: 4px;
    color: #7a6a4a;
    margin-bottom: 60px;
  }
  .divider {
    width: 200px;
    height: 1px;
    background: linear-gradient(to right, transparent, #c9a84c, transparent);
    margin-bottom: 60px;
  }
  .cards {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 20px;
  }
  .card {
    background: linear-gradient(135deg, #1a1508, #0f0f0f);
    border: 1px solid #3a2e1a;
    border-radius: 16px;
    padding: 40px 32px;
    width: 280px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .card:hover {
    border-color: #c9a84c;
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(201, 168, 76, 0.15);
  }
  .card-icon { font-size: 48px; margin-bottom: 16px; }
  .card-title {
    font-size: 24px;
    letter-spacing: 4px;
    color: #c9a84c;
    margin-bottom: 8px;
  }
  .card-en {
    font-size: 11px;
    letter-spacing: 3px;
    color: #5a4a2a;
    margin-bottom: 20px;
    font-family: sans-serif;
  }
  .card-desc {
    font-size: 14px;
    color: #8a7a5a;
    line-height: 1.8;
    margin-bottom: 24px;
  }
  .card-btn {
    display: inline-block;
    padding: 10px 28px;
    border: 1px solid #c9a84c;
    border-radius: 24px;
    font-size: 13px;
    color: #c9a84c;
    letter-spacing: 2px;
    transition: all 0.3s;
  }
  .card:hover .card-btn {
    background: #c9a84c;
    color: #0a0a0a;
  }
  .tag-free {
    display: inline-block;
    background: #1a3a1a;
    color: #4a9a4a;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-family: sans-serif;
  }
  .tag-pay {
    display: inline-block;
    background: #3a1a0a;
    color: #c9a84c;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-family: sans-serif;
  }
  .footer {
    margin-top: 80px;
    font-size: 12px;
    color: #3a3020;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="logo">易 知 阁</div>
<div class="subtitle">AI · 命理解读</div>
<div class="divider"></div>

<div class="cards">
  <a class="card" href="/shouxiang/">
    <div class="card-icon">🤲</div>
    <div class="card-title">命 纹</div>
    <div class="card-en">PALM READING</div>
    <div class="card-desc">上传手掌照片<br>AI深度解读手相<br>揭示性格与命运密码</div>
    <div class="card-btn">✦ 开始解读</div>
  </a>

  <a class="card" href="/bazi/">
    <div class="card-icon">☯</div>
    <div class="tag-pay">积分制</div>
    <div class="card-title">命 局</div>
    <div class="card-en">BAZI READING</div>
    <div class="card-desc">输入生辰八字<br>四柱命盘深度解析<br>洞悉运格与人生密码</div>
    <div class="card-btn">✦ 起卦排盘</div>
  </a>
</div>

<div class="footer">易知阁 · Powered by Claude AI</div>

</body>
</html>
